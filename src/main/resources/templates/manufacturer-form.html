<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manufacturer Form</title>
    <link rel="stylesheet" href="/css/admin.css">

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background:#f5f1e8;
        }

        .page-wrapper{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:flex-start;
            padding:40px 20px;
        }

        .form-container{
            background:white;
            padding:35px;
            border-radius:20px;
            max-width:900px;
            width:100%;
            box-shadow:0 8px 24px rgba(0,0,0,0.08);
            border:1px solid #e7dfcf;
        }

        .form-title{
            margin:0 0 25px 0;
            font-size:34px;
            color:#1b1b1b;
            font-weight:700;
        }

        .form-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .form-group{
            display:flex;
            flex-direction:column;
        }

        .form-group.full-width{
            grid-column:1 / -1;
        }

        label{
            margin-bottom:8px;
            font-weight:600;
            color:#333;
            font-size:15px;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px 14px;
            border:1px solid #d8d2c4;
            border-radius:10px;
            font-size:15px;
            outline:none;
            box-sizing:border-box;
            transition:all 0.2s ease;
            background:#fff;
        }

        input:focus,
        textarea:focus,
        select:focus{
            border-color:#4C7A64;
            box-shadow:0 0 0 3px rgba(76,122,100,0.12);
        }

        textarea{
            resize:vertical;
            min-height:100px;
        }

        .btn-area{
            margin-top:30px;
            display:flex;
            gap:12px;
            align-items:center;
        }

        .save-btn,
        .cancel-btn{
            display:inline-block;
            padding:12px 22px;
            border:none;
            border-radius:10px;
            text-decoration:none;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:0.2s ease;
        }

        .save-btn{
            background:#b65348;
            color:white;
        }

        .save-btn:hover{
            background:#9f463d;
        }

        .cancel-btn{
            background:#ece7dc;
            color:#333;
        }

        .cancel-btn:hover{
            background:#dfd7c8;
        }

        @media (max-width: 768px){
            .form-grid{
                grid-template-columns:1fr;
            }

            .form-title{
                font-size:28px;
            }

            .form-container{
                padding:25px;
            }
        }

    </style>
</head>

<body>

<div class="page-wrapper">
    <div class="form-container">

        <h1 class="form-title"
            th:text="${manufacturer.id == null ? 'Add New Manufacturer' : 'Edit Manufacturer'}">
            Add New Manufacturer
        </h1>

        <form action="/admin/manufacturer/save"
              method="post"
              th:object="${manufacturer}">

            <!-- hidden id for edit -->
            <input type="hidden"
                   th:if="${manufacturer.id != null}"
                   th:field="*{id}">

            <div class="form-grid">

                <div class="form-group">
                    <label for="manufacturerName">Manufacturer Name</label>
                    <input type="text"
                           id="manufacturerName"
                           th:field="*{manufacturerName}"
                           placeholder="Enter manufacturer name"
                           required>
                </div>

                <div class="form-group">
                    <label for="contactPerson">Contact Person</label>
                    <input type="text"
                           id="contactPerson"
                           th:field="*{contactPerson}"
                           placeholder="Enter contact person">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           placeholder="Phone number">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Enter email address">
                </div>

                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address"
                              th:field="*{address}"
                              placeholder="Enter full address"></textarea>
                </div>

                <div class="form-group">
                    <label for="paymentTerms">Payment Terms</label>
                    <input type="text"
                           id="paymentTerms"
                           th:field="*{paymentTerms}"
                           placeholder="Example: Cash / Credit 30 days">
                </div>

                <div class="form-group">
                    <label for="totalPurchaseAmount">Total Purchase Amount</label>
                    <input type="number"
                           step="0.01"
                           id="totalPurchaseAmount"
                           th:field="*{totalPurchaseAmount}"
                           placeholder="0.00">
                </div>

            </div>

            <div class="btn-area">
                <button type="submit" class="save-btn">
                    Save Manufacturer
                </button>

                <a href="/admin" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
