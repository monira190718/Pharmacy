<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Give Review</title>

    <link rel="stylesheet" href="customer.css">


    <style>

        .review-card{

            max-width:650px;
            margin:auto;
        }


        .form-group{

            margin-bottom:20px;

        }


        .form-group label{

            display:block;
            font-weight:600;
            margin-bottom:8px;

        }


        select,
        textarea{

            width:100%;
            padding:14px;

            border:1px solid #ddd;
            border-radius:10px;

            font-size:15px;

        }


        textarea{

            resize:none;

        }


        .review-btn{

            background:#155c4d;
            color:white;

            border:none;

            padding:12px 28px;

            border-radius:8px;

            cursor:pointer;

            font-weight:600;

        }


        .review-btn:hover{

            opacity:.9;

        }


    </style>


</head>



<body>


<div class="page">


    <section class="panel review-card">


        <h2>
            Share your experience
        </h2>


        <p class="muted">
            How was your last order? Your feedback helps us improve our pharmacy service.
        </p>



        <form action="/review/save" method="post">



            <div class="form-group">


                <label>
                    Rating
                </label>


                <select name="rating" required>


                    <option value="">
                        Select rating
                    </option>


                    <option value="5">
                        ★★★★★ Excellent
                    </option>


                    <option value="4">
                        ★★★★ Very Good
                    </option>


                    <option value="3">
                        ★★★ Good
                    </option>


                    <option value="2">
                        ★★ Fair
                    </option>


                    <option value="1">
                        ★ Poor
                    </option>


                </select>


            </div>





            <div class="form-group">


                <label>
                    Your Experience
                </label>


                <textarea
                        id="comment"
                        name="comment"
                        rows="6"
                        placeholder="Write your feedback here..."
                        required
                        minlength="5"
                ></textarea>


                <small id="wordCount">
                    0 / 50 words
                </small>


            </div>




            <button class="review-btn"
                    type="submit">

                Submit Review

            </button>
        </form>

    </section>
</div>

<script>

    const comment = document.getElementById("comment");
    const wordCount = document.getElementById("wordCount");


    comment.addEventListener("input", function(){

        let words = comment.value.trim().split(/\s+/);


        if(comment.value.trim()===""){
            words=[];
        }


        if(words.length > 50){

            words = words.slice(0,50);

            comment.value = words.join(" ");

        }
        wordCount.innerHTML =
            words.length + " / 50 words";


    });
</script>
</body>

</html>
