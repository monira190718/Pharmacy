<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Medicine</title>

    <link rel="stylesheet" href="/css/admin.css">


    <style>

        .form-container{

            background:white;
            padding:30px;
            border-radius:20px;
            max-width:900px;

        }


        .form-grid{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;

        }


        .form-group{

            display:flex;
            flex-direction:column;

        }


        label{

            margin-bottom:8px;
            font-weight:600;

        }


        input,
        select,
        textarea{

            padding:12px;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:15px;

        }


        textarea{

            resize:none;

        }


        .full{

            grid-column:1 / 3;

        }


        .btn-area{

            margin-top:25px;

        }


        button{

            padding:12px 25px;
            border:none;
            border-radius:10px;
            cursor:pointer;

        }


        .save-btn{

            background:#4C7A64;
            color:white;

        }


        .cancel-btn{
            display:inline-block;
            padding:12px 26px;
            background:#eeeeee;
            color:#111;
            text-decoration:none;
            border-radius:10px;
            margin-left:10px;
        }

        .cancel-btn:hover{
            background:#dddddd;
        }


    </style>


</head>



<body>


<div class="form-container">


    <h1>
        Add New Medicine
    </h1>



    <form action="/admin/medicine/save"
          method="post"
          th:object="${medicine}"
          onsubmit="return validateForm()">

        <input type="hidden" th:field="*{id}">
        <div class="form-grid">

            <!-- Medicine Name -->

            <div class="form-group">

                <label>
                    Medicine Name
                </label>


                <input type="text"
                       th:field="*{medicineName}"
                       placeholder="Enter medicine name"
                       required>

            </div>





            <!-- Generic Name -->

            <div class="form-group">

                <label>
                    Generic Name
                </label>


                <input type="text"
                       th:field="*{genericName}"
                       placeholder="Enter generic name"
                       required>

            </div>





            <!-- Category -->

            <div class="form-group">

                <label>
                    Category
                </label>


                <select th:field="*{category}" required>


                    <option value="">
                        Select Category
                    </option>


                    <option value="Tablet">
                        Tablet
                    </option>


                    <option value="Capsule">
                        Capsule
                    </option>


                    <option value="Syrup">
                        Syrup
                    </option>


                    <option value="Injection">
                        Injection
                    </option>


                    <option value="Ointment">
                        Ointment
                    </option>


                    <option value="Drops">
                        Drops
                    </option>


                </select>


            </div>





            <!-- Manufacturer -->


            <div class="form-group">

                <label>
                    Manufacturer
                </label>


                <select th:field="*{manufacturer}" required>


                    <option value="">
                        Select Manufacturer
                    </option>


                    <option value="Square Pharmaceuticals">
                        Square Pharmaceuticals
                    </option>


                    <option value="Beximco Pharma">
                        Beximco Pharma
                    </option>


                    <option value="Renata">
                        Renata
                    </option>


                    <option value="Incepta">
                        Incepta
                    </option>


                </select>


            </div>





            <!-- Batch No -->


            <div class="form-group">

                <label>
                    Batch No
                </label>


                <input type="text"
                       th:field="*{batchNo}"
                       placeholder="Example: AB123"
                       required>


            </div>





            <!-- Stock Quantity -->


            <div class="form-group">

                <label>
                    Stock Quantity
                </label>


                <input type="number"
                       th:field="*{stockQuantity}"
                       min="0"
                       required
                       placeholder="Enter quantity">


            </div>

            <!-- Unit Price -->


            <div class="form-group">

                <label>
                    Unit Price
                </label>


                <input type="number"
                       step="0.01"
                       min="0"
                       th:field="*{unitPrice}"
                       required
                       placeholder="Enter price">


            </div>

            <!-- Expiry Date -->


            <div class="form-group">

                <label>
                    Expiry Date
                </label>


                <input type="date"
                       id="expiryDate"
                       name="expiryDate"
                       th:value="${#temporals.format(medicine.expiryDate, 'yyyy-MM-dd')}"
                       required>


            </div>


            <!-- Status -->


            <div class="form-group">

                <label>
                    Status
                </label>


                <select th:field="*{status}">


                    <option value="In Stock">
                        In Stock
                    </option>


                    <option value="Low Stock">
                        Low Stock
                    </option>


                    <option value="Out of Stock">
                        Out of Stock
                    </option>


                </select>


            </div>





            <!-- Description -->


            <div class="form-group full">

                <label>
                    Description
                </label>


                <textarea rows="4"
                          th:field="*{description}"
                          placeholder="Medicine description"
                          required>
</textarea>


            </div>



        </div>




        <div class="btn-area">


            <button type="submit"
                    class="save-btn">

                Save Medicine

            </button>



            <a href="/admin">
                <button type="button" class="cancel-btn">
                    Cancel
                </button>
            </a>



        </div>

    </form>

</div>
<script>

    document.addEventListener("DOMContentLoaded", function(){

        let today = new Date();

        let yyyy = today.getFullYear();
        let mm = String(today.getMonth()+1).padStart(2,'0');
        let dd = String(today.getDate()).padStart(2,'0');

        let minDate = yyyy + "-" + mm + "-" + dd;


        document.getElementById("expiryDate")
            .setAttribute("min", minDate);


    });

</script>

<script>

    function validateForm(){

        let inputs = document.querySelectorAll(
            "input, select, textarea"
        );


        for(let input of inputs){

            if(input.hasAttribute("required")
                && input.value.trim() === ""){

                alert(
                    input.previousElementSibling.innerText
                    + " is required"
                );

                input.focus();

                return false;
            }

        }


        let stock = document.querySelector(
            "[name='stockQuantity']"
        ).value;


        if(stock < 0){

            alert("Stock Quantity cannot be negative");

            return false;
        }



        let price = document.querySelector(
            "[name='unitPrice']"
        ).value;


        if(price < 0){

            alert("Unit Price cannot be negative");

            return false;
        }

        return true;

    }

</script>

</body>


</html>
