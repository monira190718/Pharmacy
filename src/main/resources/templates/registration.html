<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — MedixPOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="registration.css">
</head>
<body>

<div class="page">

  <!-- Left panel: photo with brand + quote -->
  <aside class="photo-panel">
    <img class="photo-panel__img" src="/image/pharmacy-hero.jpg" alt="Assorted medication and a clinical thermometer">
    <div class="photo-panel__scrim" aria-hidden="true"></div>

    <a href="#" class="photo-panel__brand">
      <svg width="26" height="26" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 2C10 2 4.5 7.2 4.5 15c0 6.4 4.3 9.9 8.1 13 1.4 1.1 2.7 2.2 3.7 3.4.2.3.7.3.9 0 1-1.2 2.3-2.3 3.7-3.4 3.8-3.1 8.1-6.6 8.1-13C29.5 7.2 24 2 17 2Z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M17 9v13M11 15.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span>Medix<em>Pharmacy</em></span>
    </a>

    <blockquote class="photo-panel__quote">
      “Every bottle accounted for, every prescription on time.”
      <cite>Create an account to manage inventory, transactions, and supplier orders.</cite>
    </blockquote>
  </aside>

  <!-- Right panel: registration form -->
  <main class="form-panel">
    <div class="form-panel__inner">

      <header class="form-header">
        <h1>Create your account</h1>
        <p>Set up access to the pharmacy dashboard in a few steps.</p>
      </header>

      <p th:if="${error}"
         th:text="${error}"
         style="color:red;">
      </p>
      
      <form class="signup-form"
            
            th:action="@{/registration}"
            th:object="${user}"
            method="post">


        <div class="field">

          <label for="fullname">Full name</label>

          <input
                  type="text"
                  id="fullname"
                  th:field="*{fullname}"
                  placeholder="Jane Doe"
                  autocomplete="name"
                  required>

        </div>



        <div class="field">

          <label for="phone">Phone number</label>

          <input
                  type="tel"
                  id="phone"
                  th:field="*{phone}"
                  placeholder="+1 (555) 000-0000"
                  autocomplete="tel"
                  required>

        </div>



        <div class="field">

          <label for="email">Email address</label>

          <input
                  type="email"
                  id="email"
                  th:field="*{email}"
                  placeholder="you@yourpharmacy.com"
                  autocomplete="email"
                  required>

        </div>



        <div class="field">

          <label for="role">Role</label>

          <select id="role"
                  th:field="*{role}"
                  required>


            <option value="" disabled>
              Select your role
            </option>


            <option value="ADMIN">
              Admin
            </option>



            <option value="CUSTOMER">
              Customer
            </option>


          </select>

        </div>



        <div class="field">


          <label for="password">
            Password
          </label>


          <div class="password-input">


            <input
                    type="password"
                    id="password"
                    th:field="*{password}"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    inputmode="numeric"
                    pattern="\d{5,}"
                    minlength="5"
                    required
            >

            <button type="button"
                    class="password-toggle"
                    aria-label="Show password"
                    onclick="togglePassword('password')">


              <svg width="18" height="18"
                   viewBox="0 0 18 18"
                   fill="none">

                <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"
                      stroke="currentColor"
                      stroke-width="1.4"/>

                <circle cx="9" cy="9" r="2.4"
                        stroke="currentColor"
                        stroke-width="1.4"/>

              </svg>

            </button>

          </div>

          <span class="field__note">
        Must contain at least 5 digits
    </span>
        </div>

        <div class="field">


          <label for="confirm-password">
            Confirm password
          </label>


          <div class="password-input">


            <!-- This one is NOT in User entity -->
            <input
                    type="password"
                    id="confirm-password"
                    name="confirmPassword"
                    placeholder="Re-enter password"
                    autocomplete="new-password"
                    required>


            <button type="button"
                    class="password-toggle"
                    aria-label="Show password"
                    onclick="togglePassword('confirm-password')">


              <svg width="18" height="18"
                   viewBox="0 0 18 18"
                   fill="none">

                <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6Z"
                      stroke="currentColor"
                      stroke-width="1.4"/>

                <circle cx="9" cy="9" r="2.4"
                        stroke="currentColor"
                        stroke-width="1.4"/>

              </svg>

            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">
          Create account
        </button>


      </form>

      <p class="form-footer">
        Already have an account? <a href="/login">Sign in</a>
      </p>

    </div>
  </main>

</div>

<script>

  function togglePassword(inputId) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

      input.type = "text";

    } else {

      input.type = "password";

    }

  }

</script>

</body>
</html>
